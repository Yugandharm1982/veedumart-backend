<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeeduMart — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --teal-deep:#085041; --teal:#0F6E56; --coral:#D85A30; --coral-deep:#993C1D; --ink:#2C2C2A; --ink-soft:#6B6962; --line:#E5E2DA; --bg:#F7F5F0; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
  .topbar{background:var(--teal-deep);color:#fff;padding:18px 32px;display:flex;justify-content:space-between;align-items:center;}
  .topbar h1{font-size:18px;font-weight:700;}
  .tabs{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--line);padding:0 32px;}
  .tab{padding:14px 18px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;}
  .tab.active{color:var(--teal-deep);border-bottom-color:var(--teal-deep);}
  .panel{display:none;padding:28px 32px;max-width:1000px;margin:0 auto;}
  .panel.active{display:block;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;}
  .card h3{font-size:15px;font-weight:700;margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;font-family:'Inter',sans-serif;}
  label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field{margin-bottom:4px;}
  .btn{background:var(--teal-deep);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:14px;}
  .btn.danger{background:var(--coral-deep);}
  .btn.small{padding:6px 12px;font-size:12px;margin-top:0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:10px 12px;background:#F2EFE8;font-weight:600;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;}
  td{padding:12px;border-bottom:1px solid var(--line);}
  .status-badge{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:600;}
  .status-pending{background:#FFF3D6;color:#8A6D1B;}
  .status-confirmed{background:#DCEFF6;color:#1B6F8A;}
  .status-delivered{background:#DDF0E5;color:#0F6E56;}
  .status-cancelled{background:#FAE0DC;color:#993C1D;}
  select.status-select{width:auto;padding:6px 10px;font-size:12px;}
  .order-items{font-size:12px;color:var(--ink-soft);}
  .empty{color:var(--ink-soft);font-size:13px;padding:20px;text-align:center;}
</style>
</head>
<body>

<div class="topbar">
  <h1>VeeduMart Admin</h1>
  <span style="font-size:12px;opacity:0.8;">Manage products & orders</span>
</div>

<div class="tabs">
  <div class="tab active" data-panel="orders">Orders</div>
  <div class="tab" data-panel="products">Products</div>
</div>

<div class="panel active" id="orders">
  <div class="card">
    <h3>All orders</h3>
    <table>
      <thead><tr><th>ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead>
      <tbody id="ordersTable"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="panel" id="products">
  <div class="card">
    <h3 id="formTitle">Add a new product</h3>
    <input type="hidden" id="editId">
    <div class="form-grid">
      <div class="field"><label>Product name</label><input id="pName" placeholder="e.g. Floor cleaner 1L"></div>
      <div class="field"><label>Category</label>
        <select id="pCategory">
          <option>Cleaning</option><option>Hygiene</option><option>Daily basics</option>
          <option>Pest control</option><option>Laundry</option>
        </select>
      </div>
      <div class="field"><label>Selling price (₹)</label><input id="pPrice" type="number"></div>
      <div class="field"><label>MRP (₹, optional)</label><input id="pMrp" type="number"></div>
      <div class="field"><label>Stock quantity</label><input id="pStock" type="number"></div>
      <div class="field"><label>Description</label><input id="pDesc" placeholder="Short description"></div>
    </div>
    <button class="btn" id="saveProductBtn">Add product</button>
    <button class="btn" style="background:#8a8779;display:none;" id="cancelEditBtn">Cancel edit</button>
  </div>

  <div class="card">
    <h3>All products</h3>
    <table>
      <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody id="productsTable"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const API = '';

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.panel).classList.add('active');
  });
});

// ---------- ORDERS ----------
async function loadOrders() {
  const res = await fetch(`${API}/api/orders`);
  const orders = await res.json();
  const tbody = document.getElementById('ordersTable');
  if (!orders.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No orders yet.</td></tr>';
    return;
  }
  tbody.innerHTML = orders.map(o => `
    <tr>
      <td>#${o.id}</td>
      <td>${escapeHtml(o.customerName)}<br><span style="color:#6B6962;font-size:11.5px;">${escapeHtml(o.phone)}</span></td>
      <td class="order-items">${o.items.map(i => `${escapeHtml(i.name)} ×${i.qty}`).join('<br>')}</td>
      <td><strong>₹${o.total}</strong></td>
      <td>
        <select class="status-select" onchange="updateStatus(${o.id}, this.value)">
          ${['pending','confirmed','delivered','cancelled'].map(s =>
            `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td style="font-size:11.5px;color:#6B6962;">${new Date(o.createdAt).toLocaleString()}</td>
    </tr>
  `).join('');
}

async function updateStatus(id, status) {
  await fetch(`${API}/api/orders/${id}/status`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  });
  loadOrders();
}

// ---------- PRODUCTS ----------
async function loadProducts() {
  const res = await fetch(`${API}/api/products`);
  const products = await res.json();
  const tbody = document.getElementById('productsTable');
  if (!products.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No products yet.</td></tr>';
    return;
  }
  tbody.innerHTML = products.map(p => `
    <tr>
      <td>${escapeHtml(p.name)}</td>
      <td>${escapeHtml(p.category)}</td>
      <td>₹${p.price}</td>
      <td>${p.stock}</td>
      <td>
        <button class="btn small" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
        <button class="btn small danger" onclick="deleteProduct(${p.id})">Delete</button>
      </td>
    </tr>
  `).join('');
}

document.getElementById('saveProductBtn').addEventListener('click', async () => {
  const id = document.getElementById('editId').value;
  const body = {
    name: document.getElementById('pName').value.trim(),
    category: document.getElementById('pCategory').value,
    price: Number(document.getElementById('pPrice').value),
    mrp: Number(document.getElementById('pMrp').value) || undefined,
    stock: Number(document.getElementById('pStock').value) || 0,
    description: document.getElementById('pDesc').value.trim()
  };

  if (!body.name || !body.price) {
    alert('Name and price are required');
    return;
  }

  if (id) {
    await fetch(`${API}/api/products/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
  } else {
    await fetch(`${API}/api/products`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
  }
  resetForm();
  loadProducts();
});

function editProduct(p) {
  document.getElementById('editId').value = p.id;
  document.getElementById('pName').value = p.name;
  document.getElementById('pCategory').value = p.category;
  document.getElementById('pPrice').value = p.price;
  document.getElementById('pMrp').value = p.mrp;
  document.getElementById('pStock').value = p.stock;
  document.getElementById('pDesc').value = p.description;
  document.getElementById('formTitle').textContent = `Edit: ${p.name}`;
  document.getElementById('saveProductBtn').textContent = 'Save changes';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
}

function resetForm() {
  document.getElementById('editId').value = '';
  document.getElementById('pName').value = '';
  document.getElementById('pPrice').value = '';
  document.getElementById('pMrp').value = '';
  document.getElementById('pStock').value = '';
  document.getElementById('pDesc').value = '';
  document.getElementById('formTitle').textContent = 'Add a new product';
  document.getElementById('saveProductBtn').textContent = 'Add product';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  await fetch(`${API}/api/products/${id}`, { method: 'DELETE' });
  loadProducts();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadOrders();
loadProducts();
setInterval(loadOrders, 15000); // auto-refresh orders every 15s
</script>
</body>
</html>
